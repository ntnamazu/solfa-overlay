# タグ作成時: Audiveris 同梱の Windows インストーラ（未署名）を生成し GitHub Releases に添付する。
#
# - 配布対象は Windows のみ（mac/linux はスコープ外）。Windows ランナーなら fetch-resources の
#   MSI 展開（msiexec /a）が成立する。
# - 署名はしない（docs/ideas/audiveris-bundling-license.md の方針）。electron-builder には
#   証明書を渡さないため未署名のまま生成される。
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # GitHub Releases への添付に必要

jobs:
  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # タグ名と package.json の version が食い違ったまま配布物を作らないためのガード。
      #
      # 画面表示のバージョン（app.getVersion() → Home 画面）・インストーラ名
      # （`${productName} Setup ${version}.exe`）・exe のファイルプロパティは、いずれも
      # package.json の version が唯一の情報源。タグは release.yml の起動条件でしかなく、
      # 両者を同期する仕組みは無いため、ここで一致を検証する。
      #
      # 重い fetch-resources（MSI の DL・展開）と dist:win の前に置いて、早く落とす。
      #
      # タグ名は攻撃者が任意の文字列を作れるため、github.ref_name のテンプレート補間を
      # run: に直接埋め込まず、GitHub が用意する環境変数 GITHUB_REF_NAME 経由で参照する
      # （スクリプトインジェクション対策）。
      - name: タグと package.json の version 一致を検証
        shell: bash # windows-latest の既定は PowerShell のため明示する
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::タグ($GITHUB_REF_NAME) と package.json の version($PKG_VERSION) が一致しません。package.json を更新してからタグを打ち直してください。"
            exit 1
          fi
          echo "バージョン一致を確認: $PKG_VERSION"

      - run: npm ci

      # Audiveris(+同梱JRE) を resources/audiveris/win/ に用意（MSI DL→SHA-256検証→展開）
      - run: npm run fetch-resources

      # electron-vite build → electron-builder（未署名 NSIS）で dist/*.exe を生成
      #
      # dist:win には `--publish never` を付けている。electron-builder は git タグがあると
      # 暗黙に GitHub へ publish しようとし、GH_TOKEN 未設定で失敗するため
      # （v27 では暗黙の publish は廃止予定）。Release への添付は下の
      # softprops/action-gh-release が担当するので、ここでは生成だけを行う。
      - run: npm run dist:win

      - uses: actions/upload-artifact@v4
        with:
          name: solfa-overlay-win
          path: dist/*.exe

      # 下書きで作る。タグ push の時点では Release は公開されず、リリースノートを
      # 整えてから GitHub 上で「Publish release」する運用にする。
      - name: Attach installer to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          draft: true
